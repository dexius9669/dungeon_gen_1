<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OD&D Dungeon Master Aid - Full Tables</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap');
        body { font-family: 'Merriweather', serif; background-color: #1a1a1a; color: #e5e5e5; }
        h1, h2, h3, button { font-family: 'Cinzel', serif; }
        .log-entry { animation: fadeIn 0.2s ease-out; border-left: 4px solid #4b5563; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .monster-box { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .room-box { border-left-color: #eab308; background: rgba(234, 179, 8, 0.05); }
        .passage-box { border-left-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .treasure-box { border-left-color: #10b981; background: rgba(16, 185, 129, 0.08); }
        .trick-box { border-left-color: #a855f7; background: rgba(168, 85, 247, 0.08); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden text-sm">

    <!-- Sidebar -->
    <aside class="w-full md:w-1/3 lg:w-1/4 bg-gray-900 border-r border-gray-700 flex flex-col p-4 shadow-xl z-10 overflow-y-auto">
        <h1 class="text-xl text-yellow-500 font-bold mb-4 text-center tracking-wider border-b border-gray-700 pb-2">OD&D Master Aid</h1>
        
        <div class="flex flex-col gap-3 flex-1">
            <div class="bg-gray-800 p-3 rounded-lg border border-gray-700">
                <label class="text-[10px] text-gray-500 uppercase block mb-1">Уровень подземелья</label>
                <input type="number" id="dungeonLevel" value="1" min="1" max="12" class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-yellow-500 font-bold mb-3">
                <button onclick="startDungeon()" class="w-full bg-red-800 hover:bg-red-700 text-white font-bold py-2 px-4 rounded shadow transition uppercase text-xs">Начать генерацию</button>
            </div>

            <div class="bg-gray-800 p-3 rounded-lg border border-gray-700">
                <h2 class="text-[10px] text-gray-400 uppercase mb-2 font-bold tracking-widest border-b border-gray-700 pb-1">Ручные броски</h2>
                <div class="grid grid-cols-1 gap-1" id="manualButtons">
                    <!-- Buttons injected by JS -->
                </div>
            </div>

            <button onclick="clearLog()" class="mt-2 text-gray-500 hover:text-white text-[10px] py-1 uppercase border-t border-gray-700">Очистить Журнал</button>
        </div>

        <!-- Attribution -->
        <div class="mt-6 pt-4 border-t border-gray-800 text-center">
            <p class="text-[10px] text-gray-500 leading-relaxed">
                Создано с помощью нейросетей каналом<br>
                <a href="https://t.me/pcspeoplestoo" target="_blank" class="text-yellow-700 hover:text-yellow-500 transition decoration-dotted underline">https://t.me/pcspeoplestoo</a>
            </p>
        </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 bg-gray-800 relative flex flex-col h-full overflow-hidden">
        <div id="logArea" class="flex-1 overflow-y-auto p-6 space-y-4">
            <div class="text-center text-gray-500 italic mt-20 opacity-50">[ Ожидание действий мастера ]</div>
        </div>
    </main>

    <script>
        const state = { level: 1, currentArea: 0, exitIndex: 0, isFirstRoom: true };

        function roll(dice) {
            const [n, s] = dice.split('k').map(Number);
            let total = 0, details = [];
            for (let i = 0; i < n; i++) {
                let r = Math.floor(Math.random() * s) + 1;
                total += r; details.push(r);
            }
            return { total, details, fmt: `<span class="text-gray-500 text-[10px] ml-1">[${details.join('+')}=${total}]</span>` };
        }

        const tables = {
            "Ia": {
                name: "Ia: Форма комнаты", dice: "2k6",
                resolve: (r) => {
                    const data = {
                        2: { text: "Камера", area: 0, next: "VIa" },
                        3: { text: "Прямоугольник 20’*40’", area: 800 },
                        4: { text: "Прямоугольник 10’*20’", area: 200 },
                        5: { text: "Квадрат 40’*40’", area: 1600 },
                        6: { text: "Квадрат 20’*20’", area: 400 },
                        7: { text: "Квадрат 10’*10’", area: 100 },
                        8: { text: "Квадрат 30’*30’", area: 900 },
                        9: { text: "Квадрат 15’*15’", area: 225 },
                        10: { text: "Прямоугольник 20’*30’", area: 600 },
                        11: { text: "Нестандартная", area: 0, next: "VIb" },
                        12: { text: "Пещера", area: 0, next: "VIc" }
                    };
                    const res = data[r.total];
                    state.currentArea = res.area;
                    if (res.next) setTimeout(() => run(res.next, true), 600);
                    else setTimeout(() => run("Id", true), 600);
                    return `<span class="text-yellow-400 font-bold">${res.text}</span>`;
                }
            },
            "Ib": {
                name: "Ib: Кол-во выходов", dice: "1k6",
                resolve: (r) => {
                    let count = 0;
                    const a = state.currentArea;
                    if (r.total === 1) count = a <= 600 ? 1 : 2;
                    else if (r.total === 2) count = a <= 600 ? 2 : 3;
                    else if (r.total === 3) count = a <= 600 ? 3 : 4;
                    else if (r.total === 4) count = a <= 1200 ? 0 : 1;
                    else if (r.total === 5) count = a <= 1600 ? 0 : 1;
                    else count = roll("1k4").total;

                    if (count === 0) return `<span class="text-red-400 italic">Выходов нет (проверьте потайные двери)</span>`;
                    for (let i = 1; i <= count; i++) {
                        setTimeout(() => { state.exitIndex = i; run("Ic", true); }, i * 500);
                    }
                    return `Выходов : <b class="text-white">${count}</b>`;
                }
            },
            "Ic": {
                name: "Ic: Расположение выхода", dice: "2k6",
                resolve: (r) => {
                    let wall = "";
                    if (r.total === 2 || r.total === 12) wall = "Та же стена (45°)";
                    else if (r.total >= 3 && r.total <= 5) wall = "Левая стена";
                    else if (r.total >= 6 && r.total <= 8) wall = "Противоположная стена";
                    else wall = "Правая стена";
                    
                    const dr = roll("1k6");
                    const type = dr.total <= 4 ? "Дверь (заперта/заклинила?)" : "Открытая арка";
                    return `Выход #${state.exitIndex}: <b class="text-blue-300">${wall}</b> → ${type} ${dr.fmt}`;
                }
            },
            "Id": {
                name: "Id: Содержимое", dice: "3k6",
                resolve: (r) => {
                    let text = "Пусто"; let act = () => run("Ib", true);
                    if (r.total >= 11 && r.total <= 12) { text = "Монстр"; act = () => { spawnMonster(); run("Ib", true); }; }
                    else if (r.total >= 13 && r.total <= 15) { text = "Монстр и Сокровище"; act = () => { spawnMonster(); run("IV", true); run("Ib", true); }; }
                    else if (r.total === 16) { text = state.isFirstRoom ? "Пусто" : "Уловка"; if (!state.isFirstRoom) act = () => { run("Va", true); run("Ib", true); }; }
                    else if (r.total === 17) { text = state.isFirstRoom ? "Пусто" : "Ловушка"; if (!state.isFirstRoom) act = () => { run("Vb", true); run("Ib", true); }; }
                    else if (r.total === 18) { text = "Только сокровище"; act = () => { run("IV", true); run("Ib", true); }; }
                    
                    state.isFirstRoom = false;
                    setTimeout(act, 800);
                    return `<span class="text-orange-300 font-bold">${text}</span>`;
                }
            },
            "IIa": {
                name: "IIa: Проходы", dice: "3k6",
                resolve: (r) => {
                    const dist = (roll("1k3").total + 1) * 10;
                    let res = "Прямо"; let next = "IIa";
                    if (r.total === 3) { res = "Ловушка!"; next = "Vb"; }
                    else if (r.total === 4) { res = "Лестница"; next = "IIc"; }
                    else if (r.total >= 5 && r.total <= 7) { res = "Тупик"; next = null; }
                    else if (r.total >= 8 && r.total <= 10) { res = "Комната"; next = "Ia"; }
                    else if (r.total >= 11 && r.total <= 13) { res = "Развилка"; next = "IId"; }
                    else if (r.total >= 14 && r.total <= 15) { res = "Дверь"; next = "IIIa"; }
                    else if (r.total === 16) { res = "Проход сворачивает"; next = "IIe"; }
                    else if (r.total === 17) { res = "Прямо 60'"; next = "IIa"; }
                    else if (r.total === 18) { res = "Уловка"; next = "Va"; }
                    
                    if (next) setTimeout(() => run(next, true), 800);
                    return `Дистанция ${dist}': <b class="text-blue-400">${res}</b>`;
                }
            },
            "IIb": {
                name: "IIb: Ширина прохода", dice: "2k6",
                resolve: (r) => {
                    const w = { 2: "30'", 3: "5'", 4: "5'", 5: "10'", 6: "10'", 7: "10'", 8: "10'", 9: "10'", 10: "5'", 11: "20'", 12: "20'" };
                    return `Ширина: <b class="text-white">${w[r.total]}</b>`;
                }
            },
            "IIc": {
                name: "IIc: Лестницы", dice: "3k6",
                resolve: (r) => {
                    const l = {
                        2:"Вверх в Тупик (1-из-6 ловушка)", 3:"Вертикальный колодец вверх на 2 ур.",
                        4:"Замаскированный люк вниз на 1 ур.", 5:"Вниз на 2 уровня (опасность блока)",
                        6:"Вниз на 1 уровень", 7:"Вниз на 1 уровень", 8:"Вниз на 1 уровень",
                        9:"Вниз на 3 уровня", 10:"Замаскированный люк вниз на 2 ур.",
                        11:"Колодец вверх на 1 ур.", 12:"Вниз в Тупик (1-из-6 ловушка)"
                    };
                    const typeRoll = roll("1k6");
                    const types = ["Прямая", "Прямая", "Зигзаг", "Зигзаг", "Винтовая", "Винтовая"];
                    return `<span class="text-purple-300">Лестница: ${l[r.total]}</span> (${types[typeRoll.total-1]}) ${typeRoll.fmt}`;
                }
            },
            "IId": {
                name: "IId: Развилка", dice: "2k6",
                resolve: (r) => {
                    const d = { 2:"Налево 45° назад", 3:"Налево 45° вперёд", 4:"Y-образная", 5:"Налево 90°", 6:"Т-образная", 7:"Т-образная", 8:"Т-образная", 9:"Перекрёсток", 10:"Направо 90°", 11:"Направо 45° вперёд", 12:"Направо 45° назад" };
                    setTimeout(() => run("IIb", true), 600);
                    return `Тип: <b class="text-blue-300">${d[r.total]}</b>`;
                }
            },
            "IIe": {
                name: "IIe: Поворот прохода", dice: "2k6",
                resolve: (r) => {
                    const d = { 2:"Налево 90°", 3:"Налево 90°", 4:"Налево 90°", 5:"Налево 45° вперёд", 6:"Налево 45° назад", 7:"Переброс", 8:"Направо 45° назад", 9:"Направо 45° вперёд", 10:"Направо 90°", 11:"Направо 90°", 12:"Направо 90°" };
                    return `Поворот: <b class="text-blue-300">${d[r.total]}</b>`;
                }
            },
            "IIIa": {
                name: "IIIa: Дверь в проходе", dice: "1k6",
                resolve: (r) => {
                    const p = r.total <= 2 ? "Слева" : (r.total <= 4 ? "Прямо" : "Справа");
                    setTimeout(() => run("IIIb", true), 600);
                    return `Расположение: <b class="text-white">${p}</b>`;
                }
            },
            "IIIb": {
                name: "IIIb: За Дверью", dice: "2k6",
                resolve: (r) => {
                    if (r.total <= 7) { setTimeout(() => run("Ia", true), 600); return "Комната"; }
                    const d = { 8:"Направо 45° вперёд", 9:"Направо 45° назад", 10:"Налево 45° вперёд", 11:"Налево 45° назад" };
                    if (r.total === 12) return "Комната 10'x10' (если прямо), иначе проход";
                    setTimeout(() => { run("IIb", true); run("IIa", true); }, 600);
                    return `Проход: <b class="text-blue-300">${d[r.total]}</b>`;
                }
            },
            "IV": {
                name: "IV: Сокровище", dice: "4k6",
                resolve: (r) => {
                    const L = state.level;
                    let val = "";
                    if (r.total <= 11) val = `${1000 * L} медных монет`;
                    else if (r.total <= 14) val = `${1000 * L} серебряных монет`;
                    else if (r.total <= 16) val = `${250 * L} золотых монет`;
                    else if (r.total <= 18) val = `${375 * L} золотых монет`;
                    else if (r.total <= 20) val = `${roll("1k4").total * L} Самоцветов`;
                    else if (r.total === 21) val = `${1 * L} Украшений`;
                    else val = "МАГИЧЕСКИЙ ПРЕДМЕТ!";
                    return `<span class="text-green-400 font-bold">Находка: ${val}</span>`;
                }
            },
            "Va": {
                name: "Va: Уловка", dice: "1k6",
                resolve: (r) => {
                    const u = [
                        "Комната-лифт (20'x20'), -1 уровень на 5 часов.",
                        "Комната-лифт, -2 уровня.",
                        "Комната-лифт (1к4+1 уровней вниз), застревает.",
                        "Каменная глыба блокирует проход сзади (1к6x10 ходов).",
                        "Магический водоём (1к6: золото x5 или свинец).",
                        "Фонтан Силы (+1к6 Силы Бойцу на 1к4x10 ходов)."
                    ];
                    return `<span class="text-purple-400 font-bold">${u[r.total-1]}</span>`;
                }
            },
            "Vb": {
                name: "Vb: Ловушка", dice: "2k6",
                resolve: (r) => {
                    const l = { 2:"Яма 10' (3-из-6 падение)", 3:"Яма 10' с шипами (2к6 урона)", 4:"Стрелы (1к6 шт, яд 1-из-6)", 5:"Стрелы (1к6 шт, яд 1-из-6)", 6:"Копья (1к3 шт, яд 1-из-12)", 7:"Газ: Ослепление (непрозрачный)", 8:"Газ: Слепота (1к6 ходов)", 9:"Газ: Страх (бегство 1к4 раунда)", 10:"Газ: Сон (2к6 ходов)", 11:"Газ: Клаустрофобия (нужен Клирик)", 12:"Газ: СМЕРТЕЛЬНЫЙ" };
                    return `<span class="text-red-500 font-bold">${l[r.total]}</span>`;
                }
            },
            "VIa": {
                name: "VIa: Камера", dice: "2k6",
                resolve: (r) => {
                    const c = { 2:"Квадрат 20'x20'", 3:"Квадрат 20'x20'", 4:"Квадрат 20'x20'", 5:"Квадрат 30'x30'", 6:"Квадрат 40'x40'", 7:"Прямоугольник 20'x30'", 8:"Прямоугольник 20'x30'", 9:"Вытянутая 20'x30'", 10:"Прямоугольник 30'x50'", 11:"Прямоугольник 40'x60'", 12:"Тесный лаз 3'x3'x60'" };
                    setTimeout(() => run("Id", true), 600);
                    return `Форма: <b class="text-yellow-200">${c[r.total]}</b>`;
                }
            },
            "VIb": {
                name: "VIb: Нестандарт", dice: "1k6",
                resolve: (r) => {
                    const s = ["Овал (2600 кв.фт)", "Ромб (1300 кв.фт)", "Треугольник (900 кв.фт)", "Круг (500 кв.фт)", "Шестиугольник (3400 кв.фт)", "Восьмиугольник (3400 кв.фт)"];
                    setTimeout(() => run("Id", true), 600);
                    return `Тип: <b class="text-yellow-200">${s[r.total-1]}</b>`;
                }
            },
            "VIc": {
                name: "VIc: Пещера", dice: "2k6",
                resolve: (r) => {
                    const p = { 2:"95'x125'", 3:"50'x75'", 4:"20'x30'", 5:"35'x50'", 6:"80'x90'", 7:"40'x60'", 8:"40'x60'", 9:"40'x60'", 10:"60'x60'", 11:"150'x200'", 12:"250'x350' с Озером" };
                    setTimeout(() => run("Id", true), 600);
                    return `Размер: <b class="text-yellow-200">${p[r.total]}</b>`;
                }
            }
        };

        // Monster Logic
        const monsterTables = {
            1: ["Гоблин", "Кобольд", "Бандит", "Орк", "Крыса, гигантская", "Сороконожка, гигантская"],
            2: { 1: ["Хобгоблин", "Скелет", "Гуль", "Ящерица", "Боец 3й ур.", "Тень"], 2: ["Гнолл", "Зомби", "Теург (Маг 4)", "Паук", "Муравей", "Гном"] },
            3: ["Теург (Маг 4)", "Боец 2 ур.", "Умертвие", "Свинья, гигант.", "Лягушка, гигант.", "Краб, гигант."],
            4: { 1: ["Боец 4 ур.", "Змея", "Врайт", "Ликантроп", "Ласка", "Хорёк"], 2: ["Боец 5 ур.", "Саламандра", "Огр", "Гаргулья", "Примат", "Маг 6"] },
            5: { 1: ["Тролль", "Жук", "Кокатрис", "Чародей", "Гидра (5)", "Злой Жрец"], 2: ["Спектр", "Слизь", "Горгон", "Чернокнижник", "Гидра (6)", "Виверна"], 3: ["Боец 6", "Скорпион", "Мумия", "Медуза", "Гидра (7)", "Боец 7"] },
            6: { 1: ["Чёрный пудинг", "Волшебник", "Василиск", "Верховный Жрец", "Минотавр", "Мантикора"], 2: ["Боец 8", "Некромант", "Химера", "Вампир", "Великан", "Гидра (8)"], 3: ["Боец 9", "Заклинатель", "Виверна", "Преследователь", "Пурпурный червь", "Гидра (9)"] }
        };

        function getMonsterLevel(dLvl) {
            const r = roll("1k6").total;
            if (dLvl === 1) return r <= 2 ? 1 : (r <= 4 ? 2 : (r === 5 ? 3 : 4));
            if (dLvl === 2) return r === 1 ? 1 : (r === 2 ? 2 : (r <= 4 ? 3 : (r === 5 ? 4 : 5)));
            if (dLvl === 3) return r === 2 ? 1 : (r === 3 ? 2 : (r <= 5 ? 3 : 6));
            if (dLvl <= 5) return r === 3 ? 1 : (r <= 5 ? 3 : 6);
            return 6;
        }

        function spawnMonster() {
            const mLvl = getMonsterLevel(state.level);
            const table = monsterTables[mLvl];
            let name = "";
            const r1 = roll("1k6"), r2 = roll("1k6");
            
            if (mLvl === 1 || mLvl === 3) { name = table[r1.total-1]; }
            else {
                let sub = 1;
                if (mLvl === 2 || mLvl === 4) sub = r1.total <= 3 ? 1 : 2;
                else if (mLvl >= 5) sub = r1.total <= 2 ? 1 : (r1.total <= 4 ? 2 : 3);
                name = table[sub][r2.total-1];
            }
            
            const react = roll("2k6");
            let rText = react.total <= 2 ? "Насилие" : (react.total <= 5 ? "Враждебность" : (react.total <= 8 ? "Нейтралитет" : "Дружелюбие"));
            
            log(`
                <div class="text-[10px] text-red-400 uppercase font-bold">Встреча! (Ур. ${mLvl})</div>
                <div class="text-lg text-white font-bold">${name}</div>
                <div class="text-[11px] mt-1 text-gray-400 border-t border-gray-700 pt-1">Реакция: ${rText} ${react.fmt}</div>
            `, "monster-box");
        }

        function startDungeon() {
            clearLog();
            state.level = parseInt(document.getElementById('dungeonLevel').value) || 1;
            state.isFirstRoom = true;
            log(`<h2 class="text-center text-yellow-500 font-bold uppercase tracking-widest">Вход в Подземелье</h2>`);
            run("Ia");
        }

        function run(key, isChain = false) {
            const t = tables[key];
            if (!t) return;
            const r = roll(t.dice);
            const content = t.resolve(r);
            let box = "bg-gray-700";
            if (key.startsWith("I")) box = "room-box";
            if (key.startsWith("II")) box = "passage-box";
            if (key === "IV") box = "treasure-box";
            if (key === "Va") box = "trick-box";
            if (key === "Vb") box = "monster-box";
            
            log(`<div class="text-[9px] font-bold uppercase text-yellow-600 mb-1">${t.name}</div><div>${content} ${r.fmt}</div>`, box);
        }

        function log(html, className = "") {
            const div = document.createElement('div');
            div.className = `log-entry p-3 rounded border border-gray-600 shadow-lg ${className}`;
            div.innerHTML = html;
            const area = document.getElementById('logArea');
            if (area.innerText.includes('[ Ожидание')) area.innerHTML = '';
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function clearLog() { document.getElementById('logArea').innerHTML = ''; }

        const manual = document.getElementById('manualButtons');
        const order = ["Ia", "Ib", "Ic", "Id", "IIa", "IIb", "IIc", "IId", "IIe", "IIIa", "IIIb", "IV", "Va", "Vb", "VIa", "VIb", "VIc"];
        
        order.forEach(k => {
            const b = document.createElement('button');
            b.className = "text-[10px] bg-gray-700 hover:bg-gray-600 p-1.5 px-2 rounded border border-gray-600 text-left transition flex justify-between items-center group";
            b.innerHTML = `<span>${tables[k].name}</span> <span class="text-gray-500 group-hover:text-yellow-500">${tables[k].dice}</span>`;
            b.onclick = () => run(k);
            manual.appendChild(b);
        });

        const mBtn = document.createElement('button');
        mBtn.className = "mt-2 text-[10px] bg-red-900/40 hover:bg-red-800 p-2 rounded border border-red-700 text-white font-bold transition uppercase";
